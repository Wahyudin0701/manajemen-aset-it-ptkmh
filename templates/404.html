{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan - IT All Role Kerinci Hydropower</title>
    <link rel="stylesheet" href="{% static 'dist/style.css' %}?v=2.1">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex flex-col justify-center items-center p-4">

    <div class="text-center max-w-lg">
        <!-- Icon / Illustration -->
        <div class="mb-8 flex justify-center">
            <div class="w-32 h-32 bg-kerinci-light rounded-full flex items-center justify-center relative">
                <svg class="w-16 h-16 text-kerinci" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                
                <!-- Floating elements -->
                <div class="absolute -top-2 -right-2 w-8 h-8 bg-white rounded-full shadow-sm flex items-center justify-center animate-bounce" style="animation-delay: 0.1s;">
                    <span class="text-red-500 font-bold text-xs">4</span>
                </div>
                <div class="absolute top-10 -left-4 w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center animate-bounce" style="animation-delay: 0.5s;">
                    <span class="text-amber-500 font-bold text-sm">0</span>
                </div>
                <div class="absolute bottom-2 -right-4 w-9 h-9 bg-white rounded-full shadow-sm flex items-center justify-center animate-bounce" style="animation-delay: 0.3s;">
                    <span class="text-kerinci font-bold text-sm">4</span>
                </div>
            </div>
        </div>

        <h1 class="text-4xl font-extrabold text-gray-900 mb-3">Waduh! Tersesat?</h1>
        <p class="text-gray-500 mb-8 leading-relaxed">
            Halaman atau rute yang Anda tuju sepertinya tidak ada di dalam sistem. <br class="hidden sm:block">
            Mungkin halamannya sudah dihapus, atau Anda salah mengetik URL.
        </p>

        <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center px-6 py-3.5 bg-kerinci text-white font-bold rounded-xl text-sm shadow-sm shadow-kerinci/30 hover:bg-kerinci-dark hover:shadow-md transition-all space-x-2 group">
            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Kembali ke Dashboard</span>
        </a>
    </div>

    <!-- Footer Logo -->
    <div class="absolute bottom-8 text-center w-full">
        <img src="{% static 'img/main_logo.png' %}" alt="IT All Role" class="h-6 mx-auto opacity-50 grayscale">
    </div>

</body>
</html>
