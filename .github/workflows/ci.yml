name: ITAM PT. KMH - CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint, Check & Run Test Suite
    runs-on: ubuntu-latest

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-testing-secret-key-ptkmh-asset-management"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DB_ENGINE: "sqlite"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: |
          python manage.py check

      - name: Run Django Database Migrations
        run: |
          python manage.py migrate

      - name: Execute Automated Test Suite (assets)
        run: |
          python manage.py test assets --verbosity=2
